name: Publish .NET Tool and Container Image

on:
  workflow_call:
    inputs:
      tool_project:
        description: Path to the .csproj for the .NET tool.
        required: true
        type: string
      solution_path:
        description: Optional path to the solution to restore/test.
        required: false
        default: ""
        type: string
      configuration:
        description: Build configuration used for packing/publishing.
        required: false
        default: Release
        type: string
      dotnet_version:
        description: .NET SDK version to install.
        required: false
        default: 10.0.x
        type: string
      package_source:
        description: NuGet source to push to. Defaults to the GitHub Packages feed for the caller.
        required: false
        type: string
      output_dir:
        description: Directory where tool packages will be written before publishing.
        required: false
        default: ./artifacts/packages
        type: string
      publish_output_dir:
        description: Directory where published binaries are written for the container build.
        required: false
        default: ./artifacts/publish
        type: string
      restore_source:
        description: NuGet source to restore from for internal packages. Defaults to silvester-io-libraries.
        required: false
        default: https://nuget.pkg.github.com/silvester-io-libraries/index.json
        type: string
      publish_runtime:
        description: Runtime identifier used for publish output.
        required: false
        default: linux-x64
        type: string
      self_contained:
        description: Whether to publish as self-contained.
        required: false
        default: false
        type: boolean
      use_app_host:
        description: Whether to generate an app host for the publish output.
        required: false
        default: false
        type: boolean
      registry:
        description: Container registry hostname (defaults to ghcr.io).
        required: false
        type: string
      image_name:
        description: Image name to publish (defaults to the caller repository).
        required: false
        type: string
      context:
        description: Build context path (must include publish_output_dir).
        required: false
        type: string
      dockerfile:
        description: Containerfile/Dockerfile path. Defaults to tool project directory containerfile.
        required: false
        type: string
      platforms:
        description: Target platforms (comma-separated).
        required: false
        type: string
    secrets:
      NUGET_RESTORE_TOKEN:
        required: false
      NUGET_RESTORE_USERNAME:
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.event.repository.name }}-tool-${{ github.ref }}
  cancel-in-progress: true

env:
  NUGET_SOURCE: ${{ inputs.package_source || format('https://nuget.pkg.github.com/{0}/index.json', github.repository_owner) }}
  PACK_OUTPUT: ${{ inputs.output_dir || './artifacts/packages' }}
  PUBLISH_OUTPUT: ${{ inputs.publish_output_dir || './artifacts/publish' }}
  REGISTRY: ${{ inputs.registry || 'ghcr.io' }}
  IMAGE_NAME: ${{ inputs.image_name || github.repository }}

jobs:
  build-pack-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version || '10.0.x' }}

      - name: Configure GitHub Packages for restore
        env:
          NUGET_RESTORE_TOKEN: ${{ secrets.NUGET_RESTORE_TOKEN }}
          NUGET_RESTORE_USERNAME: ${{ secrets.NUGET_RESTORE_USERNAME }}
        run: |
          dotnet nuget update source "silvester-io-libraries" \
            --source "${{ inputs.restore_source }}" \
            --username "$NUGET_RESTORE_USERNAME" \
            --password "$NUGET_RESTORE_TOKEN" \
            --store-password-in-clear-text \
            --configfile ./nuget.config

      - name: Restore
        run: dotnet restore "${{ inputs.solution_path || inputs.tool_project }}" --configfile ./nuget.config

      - name: Test
        run: dotnet test "${{ inputs.solution_path }}" --configuration "${{ inputs.configuration }}"

      - name: Pack tool
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet pack "${{ inputs.tool_project }}" --configuration "${{ inputs.configuration }}" --output "${{ env.PACK_OUTPUT }}" /p:ContinuousIntegrationBuild=true

      - name: Publish tool package
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          packages=("${PACK_OUTPUT}"/*.nupkg)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "No packages found in ${PACK_OUTPUT}"
            exit 1
          fi

          for package in "${packages[@]}"; do
            if [[ "$package" == *.symbols.nupkg ]]; then
              echo "Skipping symbols package $package"
              continue
            fi

            echo "Pushing $package"
            dotnet nuget push "$package" \
              --source "${NUGET_SOURCE}" \
              --api-key "${NUGET_AUTH_TOKEN}" \
              --skip-duplicate
          done

      - name: Publish tool binaries
        run: |
          dotnet publish "${{ inputs.tool_project }}" \
            --configuration "${{ inputs.configuration }}" \
            --runtime "${{ inputs.publish_runtime }}" \
            --self-contained "${{ inputs.self_contained }}" \
            --output "${{ env.PUBLISH_OUTPUT }}" \
            --no-restore \
            /p:UseAppHost=${{ inputs.use_app_host }} \
            /p:ContinuousIntegrationBuild=true

      - name: Resolve container paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          tool_project="${{ inputs.tool_project }}"
          tool_dir="$(dirname "$tool_project")"
          dockerfile="${{ inputs.dockerfile }}"
          if [ -z "$dockerfile" ]; then
            dockerfile="$tool_dir/containerfile"
          fi
          context="${{ inputs.context }}"
          if [ -z "$context" ]; then
            context="."
          fi
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
          echo "context=$context" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags, labels)
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.paths.outputs.context }}
          file: ${{ steps.paths.outputs.dockerfile }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
